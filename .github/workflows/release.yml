name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply ZArchive multithread patch
        shell: pwsh
        run: |
          $header = Get-Content "external/ZArchive/include/zarchive/zarchivewriter.h" -Raw
          if ($header -notmatch "numThreads") {
            git -C external/ZArchive apply --ignore-space-change --ignore-whitespace --whitespace=nowarn "$PWD/cmake/zarchive_multithread.patch"
          }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg caching
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies via vcpkg
        run: |
          vcpkg install wxwidgets:x64-windows-static zlib:x64-windows-static openssl:x64-windows-static lz4:x64-windows-static cli11:x64-windows-static pugixml:x64-windows-static

      - name: Configure CMake (GUI)
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DXGDTOOL_BUILD_GUI=ON

      - name: Build GUI
        run: |
          cmake --build build --config Release

      - name: Configure CMake (CLI)
        run: |
          cmake -B build_cli -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DXGDTOOL_BUILD_GUI=OFF

      - name: Build CLI
        run: |
          cmake --build build_cli --config Release

      - name: Prepare Windows Release Artifacts
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -match "refs/tags/(.*)") { $matches[1] } else { "v1.4.0" }
          New-Item -ItemType Directory -Force -Path dist
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item "build\Release\XGDTool.exe" "dist\XGDTool-GUI.exe"
          Copy-Item "build_cli\Release\XGDTool.exe" "dist\XGDTool-CLI.exe"
          Copy-Item "README.md" "dist\"
          Copy-Item "CHANGELOG.md" "dist\"
          Copy-Item "LICENSE" "dist\"
          Copy-Item -Recurse "languages" "dist\"
          
          Compress-Archive -Path "dist\*" -DestinationPath "XGDTool-$tag-Win64.zip" -Force
          Copy-Item "dist\XGDTool-GUI.exe" "artifacts\" -Force
          Copy-Item "dist\XGDTool-CLI.exe" "artifacts\" -Force
          Copy-Item "XGDTool-$tag-Win64.zip" "artifacts\" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/XGDTool-GUI.exe
            dist/XGDTool-CLI.exe
            XGDTool-*-Win64.zip

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Copy & Rename APK
        run: |
          mkdir -p apk_output
          cp android/app/build/outputs/apk/release/app-release.apk apk_output/XGDTool-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apk_output/XGDTool-Android.apk

  publish-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_files/XGDTool-GUI.exe
            release_files/XGDTool-CLI.exe
            release_files/XGDTool-*.zip
            release_files/XGDTool-Android.apk
          draft: false
          prerelease: false
          generate_release_notes: true
